<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Versión para fondo azul (franja superior del login): íconos en blanco y verde.
       Se repite como mosaico; la transparencia se da con stroke-opacity para que sea muy suave. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- Libro abierto -->
    <g stroke="#FFFFFF" stroke-opacity=".22" transform="translate(28 30) rotate(-8)">
      <path d="M0 6 Q14 0 28 6 V38 Q14 32 0 38 Z"/>
      <path d="M28 6 Q42 0 56 6 V38 Q42 32 28 38"/>
      <path d="M6 14h14M6 21h14M36 14h14M36 21h14"/>
    </g>
    <!-- Lápiz -->
    <g stroke="#62B22D" stroke-opacity=".7" transform="translate(150 22) rotate(35)">
      <rect x="0" y="0" width="10" height="46" rx="1"/>
      <path d="M0 46 L5 58 L10 46"/>
      <path d="M0 8h10"/>
    </g>
    <!-- Birrete -->
    <g stroke="#FFFFFF" stroke-opacity=".22" transform="translate(232 40)">
      <path d="M0 14 L30 0 L60 14 L30 28 Z"/>
      <path d="M12 20 V34 Q30 44 48 34 V20"/>
      <path d="M60 14 V30"/>
    </g>
    <!-- Regla -->
    <g stroke="#FFFFFF" stroke-opacity=".22" transform="translate(20 140) rotate(20)">
      <rect x="0" y="0" width="70" height="16" rx="2"/>
      <path d="M10 0v6M20 0v9M30 0v6M40 0v9M50 0v6M60 0v9"/>
    </g>
    <!-- Átomo -->
    <g stroke="#62B22D" stroke-opacity=".7" transform="translate(160 160)">
      <ellipse cx="0" cy="0" rx="26" ry="10"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" transform="rotate(-60)"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
    <!-- Manzana -->
    <g stroke="#FFFFFF" stroke-opacity=".22" transform="translate(248 140)">
      <path d="M20 10 C8 2 -2 12 2 26 C5 38 14 44 20 40 C26 44 35 38 38 26 C42 12 32 2 20 10 Z"/>
      <path d="M20 10 C20 4 23 0 27 -2"/>
    </g>
    <!-- Matraz -->
    <g stroke="#FFFFFF" stroke-opacity=".22" transform="translate(40 236) rotate(-10)">
      <path d="M14 0 H30 M18 0 V16 L4 44 Q2 50 8 50 H36 Q42 50 40 44 L26 16 V0"/>
      <path d="M9 36 H35"/>
    </g>
    <!-- Escuadra -->
    <g stroke="#62B22D" stroke-opacity=".7" transform="translate(140 240) rotate(8)">
      <path d="M0 50 L0 0 L50 50 Z"/>
      <path d="M10 40 L10 24 L26 40 Z"/>
    </g>
    <!-- Fórmula -->
    <g stroke="#FFFFFF" stroke-opacity=".22" transform="translate(236 250)">
      <path d="M0 10 H14 M7 3 V17"/>
      <path d="M24 4 L34 16 M34 4 L24 16"/>
      <path d="M44 7 H58 M44 13 H58"/>
    </g>
    <!-- Puntos de relleno -->
    <g stroke="#62B22D" stroke-opacity=".7">
      <circle cx="110" cy="110" r="1.5"/><circle cx="300" cy="210" r="1.5"/><circle cx="100" cy="300" r="1.5"/><circle cx="210" cy="110" r="1.5"/>
    </g>
  </g>
</svg>
